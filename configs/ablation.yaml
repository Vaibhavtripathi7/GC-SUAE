# Ablation Study Configuration

experiment:
  name: "ablation_full"
  seed: 42
  output_dir: "outputs/ablation/"

data:
  iirs_hdr: "data/raw/data.hdr"
  iirs_qub: "data/raw/data.qub"
  dem_path: "data/processed/aligned_tmc2_dem.tif"
  feo_path: "data/processed/aligned_elemental_map.tif"
  endmember_path: "data/endmembers/relab_lunar_6minerals.npy"
  patch_size: 64
  stride: 32
  train_split: 0.80
  val_split: 0.10
  test_split: 0.10
  n_bands: 86
  feo_positive_threshold: 0.05
  slope_positive_threshold: 5.0

models:

  unimodal_2d:
    name: "Unimodal2DCNN"
    latent_dim: 64
    epochs: 65
    description: "2D-CNN autoencoder on IIRS only, global-pooled latent"

  unimodal_3d:
    name: "Unimodal3DCNN"
    latent_dim: 64
    epochs: 65
    description: "3D-CNN (spectral-spatial) autoencoder on IIRS only"

  early_fusion:
    name: "EarlyFusion"
    latent_dim: 64
    epochs: 65
    description: "Channel-stack DEM+FeO onto IIRS before encoding"

  late_fusion:
    name: "LateFusion"
    latent_dim: 64
    epochs: 65
    description: "Encode separately, concat vectors, project to latent"

  triad_base:
    name: "TRIAD"
    latent_dim: 64
    epochs: 65
    description: "Original TRIAD: pooled-vector MultiheadAttention fusion"

  gcsuae:
    name: "GC_SUAE"
    latent_dim: 128
    epochs: 100
    description: "Proposed: spatial deformable cross-attention + TAGCL + LMM decoder"
    lambda_tagcl_max: 0.5
    lambda_feo: 0.1
    lambda_dem: 0.05
    lambda_lmm: 0.2

evaluation:
  clustering:
    n_clusters: 10
    n_init: 20
  endmember_sam_threshold: 0.15
  save_figures: true
  figure_dpi: 300
