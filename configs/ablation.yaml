# Ablation Study Configuration

experiment:
  name: "ablation_full"
  seed: 42
  output_dir: "outputs/ablation/"

data:
  iirs_hdr: "data/raw/data.hdr"
  iirs_qub: "data/raw/data.qub"
  dem_path: "data/processed/aligned_tmc2_dem.tif"
  feo_path: "data/processed/aligned_elemental_map.tif"
  endmember_path: "data/endmembers/relab_lunar_6minerals.npy"
  patch_size: 64
  stride: 32
  min_valid_fraction: 1.0   # drop patches with any DEM/FeO nodata
  pixel_size_m: [79.8, 94.0]
  feo_max_valid: 21.9   # Kaguya MI mosaic fills its coverage gaps with 21.94 wt%
  train_split: 0.80
  val_split: 0.10
  test_split: 0.10
  n_bands: 86
  # TAGCL positive-pair thresholds in physical units: patch-mean FeO (wt%)
  # and patch-mean slope (degrees). Prior values (0.02 / 5.0) were set for
  # unphysical inputs (red channel of a colour map / raw Sobel output).
  feo_positive_threshold: 0.5
  slope_positive_threshold: 2.0

models:

  unimodal_2d:
    name: "Unimodal2DCNN"
    latent_dim: 128
    epochs: 100
    description: "2D-CNN autoencoder on IIRS only, global-pooled latent"

  unimodal_3d:
    name: "Unimodal3DCNN"
    latent_dim: 128
    epochs: 100
    description: "3D-CNN (spectral-spatial) autoencoder on IIRS only"

  early_fusion:
    name: "EarlyFusion"
    latent_dim: 128
    epochs: 100
    description: "Channel-stack DEM+FeO onto IIRS before encoding"

  late_fusion:
    name: "LateFusion"
    latent_dim: 128
    epochs: 100
    description: "Encode separately, concat vectors, project to latent"

  pooled_attn_fusion:
    name: "PooledAttnFusion"
    latent_dim: 128
    epochs: 100
    description: "Pooled-vector MultiheadAttention fusion (capacity/epoch-matched to GC_SUAE)"

  gcsuae:
    name: "GC_SUAE"
    latent_dim: 128
    epochs: 100
    description: "Proposed: spatial cross-attention (positional) + TAGCL + LMM decoder"
    lambda_tagcl_max: 0.5
    lambda_feo: 0.1
    lambda_dem: 0.05
    lambda_lmm: 0.2

  gcsuae_no_tagcl:
    name: "GC_SUAE_NoTAGCL"
    latent_dim: 128
    epochs: 100
    description: "Ablation: GC-SUAE architecture + LMM decoder, TAGCL disabled"
    lambda_tagcl_max: 0.0
    lambda_feo: 0.1
    lambda_dem: 0.05
    lambda_lmm: 0.2

evaluation:
  clustering:
    n_clusters: 10
    n_init: 20
  endmember_sam_threshold: 0.15
  save_figures: true
  figure_dpi: 300
